name: Ingestão de podcasts (SCD2 + dbt)

# Coleta os canais de podcast (src/main.py), escreve no Turso (DB_BACKEND=turso) e
# roda a camada dbt (dbt/) por cima — schema tests + os 2 testes singulares que
# validam a invariante SCD2. Os marts do dbt (dbt/push_marts_to_turso.py) também
# são empurrados pro Turso como tabelas — dbt-sqlite só grava local, e sem esse
# passo um consumidor remoto (dashboard no Streamlit Cloud) nunca veria os marts.
# Roda diário; o runner é efêmero, a persistência vive no Turso (ver README >
# "Por que dois stores").

# Agendamento desativado (set/2026): projeto de portfólio, a cota de escrita do
# Turso free estourou e não vale pagar pra manter a coleta rodando. O dashboard
# segue lendo o último snapshot materializado no Turso. Pra retomar, descomente o
# `schedule` abaixo e rode `gh workflow enable podcasts-ingest.yml`.
on:
  # schedule:
  #   - cron: "0 6 * * *" # 06:00 UTC = 03:00 BRT
  workflow_dispatch:

jobs:
  ingest-and-transform:
    runs-on: ubuntu-latest
    # Medido contra um Turso real: ~0.2s/vídeo (cada escrita é 1 round-trip de
    # rede). Os 5 canais (~19,5 mil vídeos) ficam em minutos-a-1h em regime de
    # cruzeiro; o 1º dia (tudo novo) fica mais perto de 2h. 240min de folga.
    timeout-minutes: 240
    env:
      DB_BACKEND: turso
      YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
      TURSO_DATABASE_URL: ${{ secrets.TURSO_DATABASE_URL }}
      TURSO_AUTH_TOKEN: ${{ secrets.TURSO_AUTH_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          # dbt-sqlite (grupo dbt-podcasts do pyproject.toml) exige 3.11/3.12 —
          # fixando aqui cobre os dois passos (ingestão não liga pra versão de Python).
          python-version: "3.11"
          enable-cache: true

      - name: Ingestão -> Turso
        run: uv run --locked --no-dev python -m src.main

      - name: Espelha Turso -> SQLite local (dbt-sqlite só lê arquivo local)
        run: uv run --locked --no-dev --group dbt-podcasts python dbt/sync_replica.py

      - name: dbt run + dbt test
        run: |
          cd dbt
          uv run --locked --no-dev --group dbt-podcasts dbt run --profiles-dir .
          uv run --locked --no-dev --group dbt-podcasts dbt test --profiles-dir .

      # Sem o grupo dbt-podcasts o uv ressincroniza a venv só com o runtime do
      # uv.lock (o mesmo SQLAlchemy testado com sqlalchemy-libsql).
      - name: Materializa os marts do dbt no Turso (dashboard remoto lê daqui)
        run: uv run --locked --no-dev python dbt/push_marts_to_turso.py
