name: Testes (pytest)

# CI rápida: roda a suíte tests/ a cada push/PR. Não bate na YouTube API de
# verdade (mockada em tests/test_ingestion.py) nem precisa de credenciais —
# cada teste isola seu próprio SQLite temporário (tests/conftest.py).

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          python-version: "3.11"
          enable-cache: true

      - name: pytest
        run: uv run --locked pytest
