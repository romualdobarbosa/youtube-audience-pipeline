name: Testes (lint + pytest)

# CI rápida: ruff + suíte tests/ a cada push/PR. Não bate na YouTube API de
# verdade (mockada em tests/test_ingestion.py) nem precisa de credenciais —
# cada teste isola seu próprio SQLite temporário (tests/conftest.py).

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      UV_LOCKED: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          python-version: "3.11"
          enable-cache: true

      - run: make lint
      - run: make test
