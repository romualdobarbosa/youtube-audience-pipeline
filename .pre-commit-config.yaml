repos:
  - repo: local
    hooks:
      - id: ruff-check
        name: ruff check
        entry: uv run ruff check --fix
        language: system
        types: [python]
      - id: ruff-format
        name: ruff format
        entry: uv run ruff format
        language: system
        types: [python]
      # src/requirements.txt é o que o Streamlit Cloud instala; mantém em dia com o uv.lock.
      - id: uv-export
        name: uv export (src/requirements.txt)
        entry: uv export --no-dev --no-hashes --no-emit-project -q -o src/requirements.txt
        language: system
        files: ^(pyproject\.toml|uv\.lock)$
        pass_filenames: false
